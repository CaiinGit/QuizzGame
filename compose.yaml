name: akasha
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://akasha:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD dans .env}@db:5432/akasha
      ALLOWED_ORIGINS: https://localhost,capacitor://localhost,${AKASHA_ORIGIN:?Configure AKASHA_ORIGIN dans .env}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: akasha
      POSTGRES_USER: akasha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD dans .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U akasha -d akasha"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
