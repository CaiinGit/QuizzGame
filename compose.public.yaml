# Optional public HTTPS entry point. Requires a domain and free ports 80/443.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AKASHA_DOMAIN: ${AKASHA_DOMAIN:?Configure AKASHA_DOMAIN dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
